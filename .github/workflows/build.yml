name: Build modules

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: |
          list="$(ls targets/*.conf | xargs -n1 basename | sed 's/\.conf$//' | jq -R . | jq -cs .)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison curl flex gcc kmod libelf-dev libssl-dev make xz-utils

      - name: Cache Synology sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/netaigis-dsm-modules
          key: sources-${{ matrix.target }}-${{ hashFiles(format('targets/{0}.conf', matrix.target)) }}

      - name: Build
        run: scripts/build.sh "targets/${{ matrix.target }}.conf"

      - name: Publish checksums
        run: |
          while read -r sum file
          do
            echo "::notice title=${{ matrix.target }}::$sum  $file"
          done < "dist/${{ matrix.target }}/SHA256SUMS"
          {
            echo "### ${{ matrix.target }}"
            echo '```'
            cat "dist/${{ matrix.target }}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # A single artifact is extracted directly into the path, several into
      # subdirectories; the target name is therefore read from build-info.txt.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir dist
          find artifacts -name build-info.txt | while read -r info
          do
            target="$(sed -n 's/^target=//p' "$info")"
            test -n "$target"
            tar -czf "dist/$target.tar.gz" -C "$(dirname "$info")" .
          done
          cd dist
          ls ./*.tar.gz > /dev/null
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            artifacts/**/*.ko

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Kernel modules built by GitHub Actions from Synology's GPL sources. Each archive contains the modules, SHA256SUMS and build-info.txt." \
            dist/*.tar.gz dist/SHA256SUMS
