name: Build modules

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          list="$(ls targets/*.conf | xargs -n1 basename | sed 's/\.conf$//' | jq -R . | jq -cs .)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison curl flex gcc kmod libelf-dev make xz-utils

      - name: Cache Synology sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/netaigis-dsm-modules
          key: sources-${{ matrix.target }}-${{ hashFiles(format('targets/{0}.conf', matrix.target)) }}

      - name: Build
        run: scripts/build.sh "targets/${{ matrix.target }}.conf"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          cd dist
          for dir in */
          do
            target="${dir%/}"
            tar -czf "$target.tar.gz" -C "$target" .
          done
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*/*.ko

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Kernel modules built by GitHub Actions from Synology's GPL sources. Each archive contains the modules, SHA256SUMS and build-info.txt." \
            dist/*.tar.gz dist/SHA256SUMS
