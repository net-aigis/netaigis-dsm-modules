name: Module pool

# Publishes one signed release fp-<id> per device fingerprint in
# fingerprints/ and in the repository of reported fingerprints, which the
# report worker writes to. That repository is only read as data: its files
# are validated by scripts/fingerprint.sh and never executed. Devices
# download releases without login.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "fingerprints/**"
      - "targets/**"
      - "scripts/**"
      - "modules.conf"
      - "module-signing.pub"
      - ".github/workflows/pool.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REPORTED_REPO: net-aigis/netaigis-dsm-fingerprints

concurrency:
  group: module-pool
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch reported fingerprints
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPORTED_REPO }}
          path: reported
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "ids=$(scripts/pool-plan.sh fingerprints reported/fingerprints)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch reported fingerprints
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPORTED_REPO }}
          path: reported
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison curl flex gcc kmod libelf-dev libssl-dev make openssl xz-utils

      - name: Cache Synology sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/netaigis-dsm-modules
          key: sources-${{ matrix.id }}
          restore-keys: sources-

      - name: Build and sign
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          fp="fingerprints/${{ matrix.id }}.txt"
          [[ -f "$fp" ]] || fp="reported/fingerprints/${{ matrix.id }}.txt"
          scripts/pool-build.sh "$fp"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: pool/${{ matrix.id }}/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ matrix.id }}"
          {
            echo "Kernel modules for device fingerprint \`$id\`, built by GitHub Actions"
            echo "from Synology's GPL sources and signed with \`module-signing.pub\`."
            echo
            echo '```'
            cat "pool/$id/manifest"
            echo '```'
          } > notes.md
          gh release create "fp-$id" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fingerprint $id" \
            --notes-file notes.md \
            --latest=false \
            pool/"$id"/*
