name = "netaigis-kmod-report"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
POOL_REPO = "net-aigis/netaigis-dsm-modules"
FINGERPRINT_REPO = "net-aigis/netaigis-dsm-fingerprints"
GITHUB_BRANCH = "main"

# Per client IP: a device reports at most once per boot.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Secret, set with: npx wrangler secret put GITHUB_TOKEN
# Fine-grained token with Contents read/write on FINGERPRINT_REPO only.
