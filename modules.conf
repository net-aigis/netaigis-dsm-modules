# Modules NetAigis may need, with their kernel source directory and the
# kernel option that must be set to "m" to build them.
#
# name             directory             option
nfnetlink          net/netfilter         CONFIG_NETFILTER_NETLINK
ip_set             net/netfilter/ipset   CONFIG_IP_SET
ip_set_hash_ip     net/netfilter/ipset   CONFIG_IP_SET_HASH_IP
ip_set_hash_net    net/netfilter/ipset   CONFIG_IP_SET_HASH_NET
x_tables           net/netfilter         CONFIG_NETFILTER_XTABLES
xt_set             net/netfilter         CONFIG_NETFILTER_XT_SET
